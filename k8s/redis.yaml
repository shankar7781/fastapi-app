# NOTE: same caveat as postgres.yaml — fine for dev/staging, but production
# at scale should use a managed Redis (ElastiCache, Memorystore) for
# durability, failover, and so a single pod restart doesn't wipe the rate
# limiter / cache state for the whole fleet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: qa-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: qa-api
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
