# TEMPLATE ONLY — copy this to secret.yaml, fill in real values, and make sure
# secret.yaml is in .gitignore. Never commit real secrets to source control.
#
# In a real deployment, prefer generating this via a secrets manager
# integration (e.g. External Secrets Operator pulling from AWS Secrets
# Manager / Vault) rather than a hand-edited file at all — see README ->
# "Managing secrets/configuration".
#
# Apply with: kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: qa-api-secrets
  namespace: qa-api
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-long-random-value"
  GEMINI_API_KEY: "replace-with-your-real-key"
  POSTGRES_USER: "qa_user"
  POSTGRES_PASSWORD: "replace-with-a-real-password"
  POSTGRES_DB: "qa_db"
