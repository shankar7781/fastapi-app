# NOTE: this runs Postgres INSIDE the cluster, which is reasonable for
# dev/staging but not recommended for real production at the 10,000-user
# scale described in the README — use a managed database (RDS, Cloud SQL,
# etc.) there instead, for automated backups, failover, and so you're not
# responsible for operating a stateful database yourself inside Kubernetes.
# Included here so the whole stack is runnable end-to-end in a test cluster.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: qa-api
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: qa-api-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qa-api-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: qa-api-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: qa-api
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None   # headless service, standard for a single-instance StatefulSet
